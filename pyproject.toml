[project]
name = "autopost"
version = "0.1.0"
description = "인스타그램 예약 자동 포스팅 (Instagram Graph API)"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
autopost = "autopost.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
